name: "Bug report / 不具合報告"
description: "Something crashed or gave a wrong result. / 落ちた・結果がおかしい"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened? / 何が起きましたか？"
      description: "Include the steps to reproduce. / 再現手順も書いてください。"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "OS / Python / Node versions"
      placeholder: "Windows 11 / Python 3.11 / Node 22"
  - type: input
    id: model
    attributes:
      label: "Model / モデル"
      placeholder: "Qwen/Qwen2.5-0.5B-Instruct"
  - type: textarea
    id: log
    attributes:
      label: "Error output / エラー出力"
      description: "Paste the terminal output. Remove personal folder paths if you want. / ターミナルの出力。個人のフォルダパスは消してOKです。"
      render: text
